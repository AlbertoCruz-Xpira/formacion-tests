<div class="code-playground code-frame" [attr.aria-label]="ariaLabel()">
	<div class="code-frame__topbar">
		<span class="code-dot code-dot--pink" aria-hidden="true"></span>
		<span class="code-dot code-dot--yellow" aria-hidden="true"></span>
		<span class="code-dot code-dot--green" aria-hidden="true"></span>
		<p class="code-frame__title">{{ title() }}</p>
	</div>

	<div class="code-playground__controls">
		<div class="code-playground__tabs" role="tablist" aria-label="Panel de codigo y respuesta">
			<button
				type="button"
				class="code-playground__tab"
				[class.is-active]="activeTab() === 'code'"
				role="tab"
				[id]="editorId + '-tab-code'"
				[attr.aria-selected]="activeTab() === 'code'"
				[attr.aria-controls]="editorId + '-panel-code'"
				(click)="selectTab('code')"
			>
				Codigo
			</button>
			<button
				type="button"
				class="code-playground__tab"
				[class.is-active]="activeTab() === 'response'"
				role="tab"
				[id]="editorId + '-tab-response'"
				[attr.aria-selected]="activeTab() === 'response'"
				[attr.aria-controls]="editorId + '-panel-response'"
				(click)="selectTab('response')"
			>
				Respuesta
			</button>
		</div>

		<button type="button" class="code-playground__run" (click)="runCode()">Ejecutar</button>
	</div>

	@if (activeTab() === 'code') {
		<section
			class="code-playground__panel"
			role="tabpanel"
			[id]="editorId + '-panel-code'"
			[attr.aria-labelledby]="editorId + '-tab-code'"
		>
			<label class="code-playground__label" [attr.for]="editorId">{{ editorLabel() }}</label>
			<textarea
				class="code-playground__editor"
				[id]="editorId"
				[value]="editableCode()"
				(input)="onCodeInput($event)"
				spellcheck="false"
			></textarea>
		</section>
	} @else {
		<section
			class="code-playground__panel"
			role="tabpanel"
			[id]="editorId + '-panel-response'"
			[attr.aria-labelledby]="editorId + '-tab-response'"
		>
			<pre class="code-playground__output" aria-live="polite">{{ response() }}</pre>
		</section>
	}
</div>
